<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarik Tali Lampu - Fakta Acak</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; background-color: #0f1115; 
      font-family: 'Segoe UI', sans-serif; overflow: hidden;
      user-select: none; transition: background-color 0.8s ease;
    }

    .bg-glow {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 40%, rgba(255, 210, 70, 0.25) 0%, transparent 70%);
      opacity: 0; z-index: 0; pointer-events: none; transition: opacity 0.8s ease;
    }

    h1 {
      color: white; margin-bottom: 50px; font-weight: 400;
      letter-spacing: 1px; z-index: 1; text-align: center;
      padding: 0 20px; transition: color 0.6s ease;
    }

    .main-container {
      display: flex; align-items: center; gap: 80px; z-index: 1;
    }

    /* LAMPU */
    .lamp-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
    .lamp-shade {
      width: 140px; height: 60px; background: #e0e0e0; border-radius: 70px 70px 0 0;
      position: relative; z-index: 3; transition: all 0.5s ease;
    }
    .lamp-bulb {
      position: absolute; top: 45px; width: 40px; height: 40px;
      background: #ffffff; border-radius: 50%; z-index: 2; opacity: 0;
      box-shadow: 0 0 40px #ffdd00, 0 0 80px #ffaa00; transition: opacity 0.6s ease;
    }
    .lamp-stand { width: 12px; height: 120px; background: #cccccc; z-index: 1; }
    .lamp-base { width: 80px; height: 10px; background: #cccccc; border-radius: 5px; z-index: 1; }
    .lamp-light {
      position: absolute; top: 55px; width: 300px; height: 400px;
      background: linear-gradient(to bottom, rgba(255, 235, 120, 0.6) 0%, rgba(255, 220, 80, 0.1) 60%, transparent 100%);
      clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%); opacity: 0;
      pointer-events: none; transition: opacity 0.6s ease; z-index: 4;
    }

    /* TALI PENARIK */
    .pull-string-container {
      position: absolute; top: 60px; left: 75%; display: flex;
      flex-direction: column; align-items: center; z-index: 5;
    }
    .pull-string {
      width: 3px; height: 60px; background: #888; transform-origin: top center;
    }
    .pull-handle {
      width: 22px; height: 22px; background: linear-gradient(135deg, #fcecae, #d4af37); 
      border-radius: 50%; cursor: grab; touch-action: none; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transform: translateY(-5px);
    }
    .pull-handle:active { cursor: grabbing; }

    /* KOTAK FAKTA */
    .fact-box {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px;
      border-radius: 20px; width: 260px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center; opacity: 0; transform: translateY(30px);
      pointer-events: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .fact-box h2 { color: #ffd700; margin-top: 0; margin-bottom: 20px; font-weight: 500; }
    .fact-box p { color: white; font-size: 16px; line-height: 1.6; margin: 0; }

    /* DEKORASI TEMATIK */
    .decor-container {
      position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: -1; overflow: visible;
    }
    .floating-decor {
      position: absolute; font-size: 32px; opacity: 0;
      transform: translate(-50%, -50%); pointer-events: none;
    }

    /* KELAS AKTIF */
    .lamp-wrapper.on .lamp-light, .lamp-wrapper.on .lamp-bulb { opacity: 1; }
    .lamp-wrapper.on .lamp-shade { background: #fffdf2; box-shadow: 0 -10px 50px rgba(255, 230, 100, 0.5); }
    .fact-box.active { opacity: 1; transform: translateY(0); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      h1 { font-size: 22px; margin-bottom: 30px; }
      .main-container { flex-direction: column; gap: 40px; }
      .fact-box { width: 85%; max-width: 300px; padding: 25px 20px; }
      .lamp-light { height: 280px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow" id="bgGlow"></div>
  <h1 id="titleText">Nyalakan Lampu Untuk Mengetahui Fakta</h1>

  <div class="main-container">
    <div class="lamp-wrapper" id="lampWrapper">
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div>
      <div class="lamp-light"></div>
      <div class="lamp-stand"></div>
      <div class="lamp-base"></div>
      
      <div class="pull-string-container">
        <div class="pull-string" id="pullString">
          <div class="pull-handle" id="pullHandle" style="position: absolute; bottom: -10px; left: -9px;"></div>
        </div>
      </div>
    </div>

    <div class="fact-box" id="factBox">
      <div class="decor-container" id="decorContainer"></div>
      <h2>Tahukah Kamu?</h2>
      <p id="factText">Tarik tali untuk melihat fakta!</p>
    </div>
  </div>

  <script>
    const handle = document.getElementById("pullHandle");
    const pullString = document.getElementById("pullString"); 
    const factBox = document.getElementById("factBox");
    const factText = document.getElementById("factText"); 
    const lampWrapper = document.getElementById("lampWrapper");
    const bgGlow = document.getElementById("bgGlow");
    const body = document.body;
    const titleText = document.getElementById("titleText");
    const decorContainer = document.getElementById("decorContainer");

    const clickSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");

    let isOn = false; 
    let isDragging = false;
    let startX = 0, startY = 0; 
    const maxPull = 60; 
    let hasToggled = false; 

    // 1. Ubah daftarFakta menjadi array kosong atau teks loading
    let daftarFakta = ["Sedang mengambil fakta dari satelit... Tarik lagi sebentar ya!"];

    // 2. Ganti URL di bawah ini dengan URL Web App dari langkah ke-2
    const urlDatabase = "https://script.google.com/macros/s/AKfycbw8dL6QoG0X_ZAZtlnbs6DptV1Z5lbIkZBvFffz3-d3K4YYEvEGRdfamhpvicPwqWL7/exec";

    // 3. Mengambil data dari Google Sheets
    fetch(urlDatabase)
      .then(response => response.json())
      .then(data => {
        if (data.length > 0) {
          daftarFakta = data; // Mengganti teks loading dengan 100 fakta dari spreadsheet
        }
      })
      .catch(error => console.error("Gagal mengambil data:", error));

    handle.addEventListener("mousedown", dragStart);
    handle.addEventListener("touchstart", dragStart, { passive: false });
    window.addEventListener("mousemove", drag);
    window.addEventListener("touchmove", drag, { passive: false });
    window.addEventListener("mouseup", dragEnd);
    window.addEventListener("touchend", dragEnd);

    function dragStart(e) {
      isDragging = true;
      hasToggled = false; 
      startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      body.style.cursor = "grabbing"; 
    }

    function drag(e) {
      if (!isDragging) return;
      
      let currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      let currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      
      let deltaX = currentX - startX;
      let deltaY = currentY - startY;

      // Cegah perhitungan jika didorong ke atas
      if (deltaY < 0) deltaY = 0; 

      let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      
      if (distance > maxPull) {
        let ratio = maxPull / distance;
        deltaX *= ratio;
        deltaY *= ratio;
        distance = maxPull;
      }

      let angle = Math.atan2(deltaX, deltaY) * (180 / Math.PI);
      gsap.set(pullString, { height: 60 + distance, rotation: -angle });

      // PERBAIKAN BUG: Lampu HANYA menyala jika tarikan ke BAWAH (deltaY) cukup dalam.
      // Dulu pakai "distance", sehingga digeser ke samping pun lampu nyala.
      if (deltaY > (maxPull * 0.70) && !hasToggled) {
        toggleLight();
        hasToggled = true; 
      }
    }

    function dragEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      body.style.cursor = "default";
      gsap.to(pullString, { height: 60, rotation: 0, duration: 1.2, ease: "elastic.out(1, 0.2)" });
    }

    function spawnDecorations(text) {
      decorContainer.innerHTML = ""; 
      
      let icons = ["✨", "💡", "🌟", "💫"]; 
      let lowerText = text.toLowerCase();

      const kamusEmotikon = [
        { words: ["kucing", "meong", "anak bulu"], icons: ["🐱", "🐈", "🐾", "🧶"] },
        { words: ["anjing", "guk"], icons: ["🐶", "🐕", "🦴", "🐾"] },
        { words: ["burung", "terbang", "elang"], icons: ["🐦", "🦅", "🕊️", "🪶"] },
        { words: ["gurita", "laut", "samudra", "pantai", "hiu", "paus", "ikan"], icons: ["🌊", "🐙", "🦈", "🐳", "🐟", "🐚", "🏝️"] },
        { words: ["kutu", "serangga", "semut", "nyamuk", "laba-laba"], icons: ["🐜", "🐞", "🦠", "🕷️", "🕸️"] },
        { words: ["ular", "berbisa", "reptil", "buaya"], icons: ["🐍", "🐊", "⚠️"] },
        { words: ["dinosaurus", "purba", "fosil", "t-rex"], icons: ["🦖", "🦕", "🦴", "🌋"] },
        { words: ["kuda", "sapi", "susu", "kambing"], icons: ["🐴", "🐄", "🥛", "🧀"] },
        
        { words: ["luar angkasa", "bintang", "planet", "galaksi", "astronot", "meteor"], icons: ["🌌", "⭐", "🪐", "🛸", "🚀", "🛰️"] },
        { words: ["bumi", "nuklir", "radiasi"], icons: ["🌍", "☢️", "☄️"] },
        { words: ["hujan", "petir", "badai", "awan", "cuaca", "air"], icons: ["🌧️", "⚡", "🌩️", "☁️", "💧"] },
        { words: ["es", "salju", "dingin", "beku"], icons: ["❄️", "⛄", "🧊", "🏔️"] },
        { words: ["api", "panas", "terbakar", "gunung"], icons: ["🔥", "🌋", "🥵", "⛰️"] },
        { words: ["pohon", "hutan", "kayu", "daun", "tanaman"], icons: ["🌳", "🌲", "🌿", "🪵", "🌱"] },
        { words: ["bunga", "matahari"], icons: ["🌻", "☀️", "🐝"] },

        { words: ["pisang", "stroberi", "apel", "jeruk", "buah", "semangka"], icons: ["🍌", "🍓", "🍎", "🍊", "🍉", "🍇"] },
        { words: ["kopi", "kafein"], icons: ["☕", "🤎", "🥱"] },
        { words: ["cokelat", "manis", "gula", "permen", "madu"], icons: ["🍫", "🍩", "🍬", "🍭", "🍯"] },
        { words: ["mochi", "tahu", "wajan", "masak", "nasi", "telur"], icons: ["🍡", "🥟", "🍳", "🍽️", "🤤", "🍚"] },

        { words: ["tidur", "mimpi", "kasur", "ngantuk", "siput"], icons: ["💤", "🛌", "🌙", "😴", "🐌"] },
        { words: ["otak", "pikiran", "cerdas", "pintar"], icons: ["🧠", "💡", "💭", "🎓"] },
        { words: ["jantung", "darah", "tubuh", "sel"], icons: ["🫀", "❤️", "🩸", "🧬"] },
        { words: ["tulang", "tengkorak", "kerangka"], icons: ["🦴", "💀", "🏴‍☠️"] },
        
        { words: ["buku", "membaca", "perpustakaan", "sejarah"], icons: ["📚", "📖", "🤓", "📜"] },
        { words: ["musik", "lagu", "nyanyi", "suara", "piano", "gitar"], icons: ["🎵", "🎶", "🎸", "🎹", "🎧"] },
        { words: ["waktu", "jam", "tahun", "bulan", "hari"], icons: ["⏳", "⏰", "📅", "📆"] },
        { words: ["mesir", "piramida", "mumi", "gurun"], icons: ["🐪", "🏜️", "🛕", "☀️"] },
        { words: ["uang", "kaya", "emas", "berlian", "keuangan"], icons: ["💰", "💵", "🪙", "💎", "💸"] },
        { words: ["hantu", "seram", "takut", "misteri", "kutukan"], icons: ["👻", "🦇", "🎃", "😱", "🧿"] },
        { words: ["bioskop", "film", "tiket", "kamera"], icons: ["🎬", "🍿", "🎟️", "🎥"] },

        { words: ["komputer", "teknologi", "internet", "kode", "ai", "robot", "python"], icons: ["💻", "🌐", "🤖", "⌨️", "🔌"] },
        { words: ["excel", "spreadsheet", "data", "angka", "rumus", "macro"], icons: ["📊", "📈", "📉", "🖥️"] },
        { words: ["alien", "jam tangan", "omnitrix"], icons: ["⌚", "👽", "🟢", "☄️"] },
        { words: ["game", "minecraft", "kubus", "bermain", "dunia"], icons: ["🎮", "🟩", "⛏️", "🕹️"] },
        { words: ["sihir", "anime", "jujutsu", "teknik"], icons: ["🔮", "💥", "🤞", "✨"] }
      ];

      for (let i = 0; i < kamusEmotikon.length; i++) {
        if (kamusEmotikon[i].words.some(word => lowerText.includes(word))) {
          icons = kamusEmotikon[i].icons;
          break; 
        }
      }

      for (let i = 0; i < 6; i++) {
        let el = document.createElement("div");
        el.className = "floating-decor";
        el.innerText = icons[Math.floor(Math.random() * icons.length)];
        decorContainer.appendChild(el);

        let throwAngle = (i / 6) * Math.PI * 2 + (Math.random() * 0.5);
        let throwDistance = 100 + Math.random() * 60; 
        let targetX = Math.cos(throwAngle) * throwDistance;
        let targetY = Math.sin(throwAngle) * throwDistance;

        gsap.fromTo(el, 
          { x: 0, y: 0, opacity: 0, scale: 0 },
          { x: targetX, y: targetY, opacity: 0.8, scale: 1 + Math.random(), duration: 1, ease: "back.out(1.5)" }
        );

        gsap.to(el, {
          y: targetY - 25,
          rotation: (Math.random() - 0.5) * 40,
          duration: 2 + Math.random(),
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
          delay: 1
        });
      }
    }

    function toggleLight() {
      clickSound.currentTime = 0; 
      clickSound.play();
      isOn = !isOn; 

      if (isOn) {
        const faktaAcak = daftarFakta[Math.floor(Math.random() * daftarFakta.length)];
        factText.textContent = faktaAcak; 
        
        spawnDecorations(faktaAcak);

        factBox.classList.add("active");
        lampWrapper.classList.add("on"); 
        body.style.backgroundColor = "#1a1d24";
        bgGlow.style.opacity = "1";
        titleText.style.color = "#fff";
      } else {
        factBox.classList.remove("active");
        lampWrapper.classList.remove("on"); 
        body.style.backgroundColor = "#0f1115";
        bgGlow.style.opacity = "0";
        titleText.style.color = "#aaa"; 
        decorContainer.innerHTML = ""; 
      }
    }
  </script>

</body>
</html>
