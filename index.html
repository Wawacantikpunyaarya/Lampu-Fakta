<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarik Tali Lampu - Fakta Acak</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* 1. PENGATURAN DASAR */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0f1115; /* Sedikit lebih gelap agar kontras cahaya lebih bagus */
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.8s ease;
    }

    .bg-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, rgba(255, 210, 70, 0.25) 0%, transparent 70%);
      opacity: 0; 
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    h1 {
      color: white;
      margin-bottom: 50px;
      font-weight: 400;
      letter-spacing: 1px;
      z-index: 1;
      text-align: center;
      padding: 0 20px;
      transition: color 0.6s ease;
    }

    .main-container {
      display: flex;
      align-items: center;
      gap: 80px; 
      z-index: 1;
    }

    /* 2. LAMPU & EFEK CAHAYA */
    .lamp-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lamp-shade {
      width: 140px;
      height: 60px;
      background: #e0e0e0;
      border-radius: 70px 70px 0 0;
      position: relative;
      z-index: 3; /* Lebih tinggi dari bola lampu */
      transition: all 0.5s ease;
    }

    .lamp-bulb {
      position: absolute;
      top: 45px; /* Mengintip sedikit dari bawah kap */
      width: 40px;
      height: 40px;
      background: #ffffff;
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
      box-shadow: 0 0 40px #ffdd00, 0 0 80px #ffaa00;
      transition: opacity 0.6s ease;
    }

    .lamp-stand {
      width: 12px;
      height: 120px;
      background: #cccccc;
      z-index: 1;
    }

    .lamp-base {
      width: 80px;
      height: 10px;
      background: #cccccc;
      border-radius: 5px;
      z-index: 1;
    }

    .lamp-light {
      position: absolute;
      top: 55px;
      width: 300px;
      height: 400px;
      background: linear-gradient(to bottom, rgba(255, 235, 120, 0.6) 0%, rgba(255, 220, 80, 0.1) 60%, transparent 100%);
      clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 4;
    }

    /* 3. TALI PENARIK YANG DIPERBAIKI */
    .pull-string-container {
      position: absolute;
      top: 60px;
      left: 75%; /* Sedikit digeser agar tidak menabrak tiang lampu */
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .pull-string {
      width: 3px; /* Sedikit ditebalkan */
      height: 60px; 
      background: #888;
      transform-origin: top; /* Agar memanjangnya dari atas ke bawah */
    }

    .pull-handle {
      width: 22px; 
      height: 22px;
      background: linear-gradient(135deg, #fcecae, #d4af37); /* Efek 3D pada bola emas */
      border-radius: 50%;
      cursor: grab;
      touch-action: none; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    .pull-handle:active {
      cursor: grabbing;
    }

    /* 4. KOTAK FAKTA */
    .fact-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      width: 260px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none; 
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fact-box h2 {
      color: #ffd700;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 500;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .fact-box p {
      color: white;
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    /* 5. KELAS 'ACTIVE' KETIKA MENYALA */
    .lamp-wrapper.on .lamp-light { opacity: 1; }
    .lamp-wrapper.on .lamp-bulb { opacity: 1; }
    .lamp-wrapper.on .lamp-shade {
      background: #fffdf2; 
      box-shadow: 0 -10px 50px rgba(255, 230, 100, 0.5), inset 0 -5px 15px rgba(255, 210, 50, 0.7);
    }
    .fact-box.active {
      opacity: 1; 
      transform: translateY(0);
    }

    /* 6. RESPONSIVE UNTUK HP */
    @media (max-width: 768px) {
      h1 { font-size: 22px; margin-bottom: 30px; }
      .main-container { flex-direction: column; gap: 40px; }
      .fact-box { width: 85%; max-width: 300px; padding: 25px 20px; }
      .lamp-light { height: 280px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow" id="bgGlow"></div>

  <h1 id="titleText">Nyalakan Lampu Untuk Mengetahui Fakta</h1>

  <div class="main-container">
    <div class="lamp-wrapper" id="lampWrapper">
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div> <!-- Bola lampu baru yang akan menyala -->
      <div class="lamp-light"></div>
      <div class="lamp-stand"></div>
      <div class="lamp-base"></div>
      
      <!-- Container tali & bola sudah diperbaiki -->
      <div class="pull-string-container">
        <div class="pull-string" id="pullString"></div>
        <div class="pull-handle" id="pullHandle"></div>
      </div>
    </div>

    <div class="fact-box" id="factBox">
      <h2>Tahukah Kamu?</h2>
      <p id="factText">Tarik tali untuk melihat fakta!</p>
    </div>
  </div>

  <script>
    const handle = document.getElementById("pullHandle");
    const pullString = document.getElementById("pullString"); 
    const factBox = document.getElementById("factBox");
    const factText = document.getElementById("factText"); 
    const lampWrapper = document.getElementById("lampWrapper");
    const bgGlow = document.getElementById("bgGlow");
    const body = document.body;
    const titleText = document.getElementById("titleText");

    let isOn = false; 
    let isDragging = false;
    let startY = 0;
    const maxPull = 60; // Batas tarikan maksimal
    let hasToggled = false; // Mencegah lampu nyala-mati berulang kali saat ditarik

    const daftarFakta = [
      "Madu tidak pernah basi. Para arkeolog menemukan pot madu di makam Mesir kuno yang berumur lebih dari 3.000 tahun dan masih bisa dimakan.",
      "Jantung udang terletak di kepalanya.",
      "Siput bisa tidur selama tiga tahun tanpa henti.",
      "Sidik jari koala sangat mirip dengan manusia, bahkan bisa membingungkan penyidik di tempat kejadian perkara.",
      "Gurita memiliki tiga jantung, sembilan otak, dan darah berwarna biru.",
      "Pisang sebenarnya adalah buah beri, tetapi stroberi bukan.",
      "Kutu bisa melompat hingga 200 kali panjang tubuhnya. Setara dengan manusia yang melompat setinggi gedung Empire State.",
      "Air di bumi usianya jauh lebih tua daripada matahari kita."
    ];

    handle.addEventListener("mousedown", dragStart);
    handle.addEventListener("touchstart", dragStart, { passive: false });

    window.addEventListener("mousemove", drag);
    window.addEventListener("touchmove", drag, { passive: false });

    window.addEventListener("mouseup", dragEnd);
    window.addEventListener("touchend", dragEnd);

    function dragStart(e) {
      isDragging = true;
      hasToggled = false; // Reset status saat mulai menarik
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      body.style.cursor = "grabbing"; 
    }

    function drag(e) {
      if (!isDragging) return;
      
      let currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      let tarikJarak = currentY - startY;

      // Batasi agar tidak bisa ditarik tembus ke bawah atau didorong ke atas
      if (tarikJarak < 0) tarikJarak = 0;
      if (tarikJarak > maxPull) tarikJarak = maxPull;

      // Hanya mengubah tinggi tali. Bola otomatis terdorong ke bawah.
      pullString.style.height = `${60 + tarikJarak}px`; 

      // Nyalakan lampu persis ketika tali ditarik cukup dalam (mirip sakelar mekanik)
      if (tarikJarak > (maxPull * 0.75) && !hasToggled) {
        toggleLight();
        hasToggled = true; // Kunci agar tidak tereksekusi berkali-kali
      }
    }

    function dragEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      body.style.cursor = "default";

      // Animasi kembalinya tali dibuat sangat liquid/membal
      gsap.to(pullString, { height: 60, duration: 1.2, ease: "elastic.out(1, 0.2)" });
    }

    function toggleLight() {
      isOn = !isOn; 

      if (isOn) {
        const faktaAcak = daftarFakta[Math.floor(Math.random() * daftarFakta.length)];
        factText.textContent = faktaAcak; 

        factBox.classList.add("active");
        lampWrapper.classList.add("on"); 
        
        body.style.backgroundColor = "#1a1d24";
        bgGlow.style.opacity = "1";
        titleText.style.color = "#fff";
      } else {
        factBox.classList.remove("active");
        lampWrapper.classList.remove("on"); 
        
        body.style.backgroundColor = "#0f1115";
        bgGlow.style.opacity = "0";
        titleText.style.color = "#aaa"; // Redupkan judul saat lampu mati
      }
    }
  </script>

</body>
</html>
